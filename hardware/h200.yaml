_comment: "SXM H200 shares the H100 GH100 Hopper compute die (same SMs/Tensor Cores) => identical peak FLOPs; differs only in memory: 141 GiB HBM3e vs 80, 4.8 TB/s vs 3.35. FLOPs & bandwidth are the NVIDIA H200 datasheet spec (https://www.nvidia.com/en-us/data-center/h200/; dense BF16 989.5 TFLOPS, dense FP8 1979 TFLOPS). MFU is CARRIED OVER from H100 (Discussion #589). BLIS roofline step time is max(compute, memory) (sim/latency/roofline.go): mfuPrefill transfers cleanly since prefill is compute-bound on the identical die, and small-batch (memory-bound) decode — the common case — is unaffected by mfuDecode because the ~1.43x = 4.8/3.35 speedup flows through BwPeakTBs on the memory branch. CAVEAT: large-batch decode can be compute-bound, where mfuDecode binds directly and this carried-over H100 value is UNVALIDATED for H200. An H200-specific MFU fit is tracked as a follow-up in #1711."
TFlopsPeak: 989.5
TFlopsFP8: 1979.0
BwPeakTBs: 4.8
mfuPrefill: 0.45
mfuDecode: 0.30
MemoryGiB: 141.0
_comment_interconnect: "Per-GPU EFFECTIVE unidirectional bandwidths in GB/s; only their RATIO is used, to price cross-node collective traffic (#1530). NVLink 4: 900 GB/s bidirectional per GPU (NVIDIA H200 datasheet) => 450 unidirectional. Inter-node: standard 8-GPU HGX H200 pairs each GPU with one single-port 400 Gb/s ConnectX-7 NIC (1:1 GPU:NIC rail) => 50 GB/s. Ratio 9x — same NVLink 4 + ConnectX-7 fabric as HGX H100."
IntraNodeBwGBps: 450
InterNodeBwGBps: 50
