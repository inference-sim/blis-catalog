_comment: "MFU values calibrated per Discussion #589: https://github.com/inference-sim/inference-sim/discussions/589. KNOWN DISCREPANCY (mixed sparsity conventions): TFlopsFP8=1466 is the WITH-SPARSITY figure while TFlopsPeak=362.05 is DENSE BF16 (NVIDIA L40S datasheet: FP8 733 dense / 1466 sparse; BF16 362.05 dense / 733 sparse). This gives an architecturally impossible 4.05x FP8:BF16 ratio (H100/H200 are exactly 2.0x); the dense-consistent value is 733. Migrated VERBATIM from inference-sim hardware_config.json to preserve the exact C6 round-trip; the fix belongs upstream in hardware_config.json first (it feeds the roofline model), tracked as a follow-up."
TFlopsPeak: 362.05
TFlopsFP8: 1466.0
BwPeakTBs: 0.864
mfuPrefill: 0.32
mfuDecode: 0.08
MemoryGiB: 48.0
_comment_interconnect: "Per-GPU EFFECTIVE unidirectional bandwidths in GB/s; only their RATIO is used, to price cross-node collective traffic (#1530). No NVLink: peer-to-peer runs over PCIe Gen4 x16 (~32 GB/s per direction); inter-node = one 100 GbE port per GPU (12.5 GB/s). Ratio 2.6x — a PCIe node is far less penalized by spanning than an NVLink node, because its on-node link is already slow."
IntraNodeBwGBps: 32
InterNodeBwGBps: 12.5
