# InfiniBand NDR (400 Gb/s) — reusable inter-node fabric CLASS.
# A Cluster references this by filename stem (see clusters/); the GPU die it runs
# with lives in the Cluster, not here — per inference-sim#1662 a fabric is a
# cluster/pool property, not a property of the chip.
provenance: vendor_spec
InterNodeBwGBps: 50
pd_transfer_base_latency_ms: 0
_comment_interconnect: "InfiniBand NDR: one 400 Gb/s ConnectX-7 NIC per GPU (1:1 GPU:NIC rail), the standard 8-NIC HGX config. InterNodeBwGBps is the NOMINAL datasheet figure — 400 Gb/s / 8 = 50 GB/s per GPU, per direction — NOT a measurement; real RDMA payload throughput runs below nominal (inference-sim#1632). The measured overhead/correction factor (effective / nominal) is a per-cluster number and lives in blis-registry, not in the catalog. Paired with a chip's on-node IntraNodeBwGBps, only the RATIO prices cross-node collective traffic (#1530); that ratio is a per-cluster (chip + fabric) quantity, stated at the Cluster."
_comment_pd_transfer: "PD KV-transfer over this fabric uses this same InterNodeBwGBps as its nominal bandwidth — there is no separate PD bandwidth figure (the old 25 GB/s --pd-transfer-bandwidth default was an implicit roce-200g assumption; see networks/roce-200g.yaml). pd_transfer_base_latency_ms is 0 here: the catalog states no inherent fabric base latency. The 0.05 ms --pd-transfer-base-latency default is a modeling placeholder, not a fabric fact, and lives in blis-registry (R2 registry follow-up; refs collected in inference-sim#1632). The CLI flags remain as overrides, so a run naming no cluster is byte-identical."
