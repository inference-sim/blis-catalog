# RoCE (RDMA over Converged Ethernet, 200 Gb/s) — reusable inter-node fabric CLASS.
# A Cluster references this by filename stem (see clusters/); the GPU die it runs
# with lives in the Cluster, not here — per inference-sim#1662 a fabric is a
# cluster/pool property, not a property of the chip.
provenance: vendor_spec
InterNodeBwGBps: 25
pd_transfer_base_latency_ms: 0
_comment_interconnect: "RoCE (GPUDirect RDMA over Converged Ethernet): one 200 Gb/s ConnectX RoCE port per GPU. InterNodeBwGBps is the NOMINAL datasheet figure — 200 Gb/s / 8 = 25 GB/s per GPU, per direction — NOT a measurement; real RDMA payload throughput runs below nominal (inference-sim#1632). The measured overhead/correction factor (effective / nominal) is a per-cluster number and lives in blis-registry, not in the catalog. Paired with a chip's on-node IntraNodeBwGBps, only the RATIO prices cross-node collective traffic (#1530); that ratio is a per-cluster (chip + fabric) quantity, stated at the Cluster."
_comment_pd_transfer: "PD KV-transfer over this fabric uses this same InterNodeBwGBps (25 GB/s nominal) as its bandwidth — no separate PD figure. The old 25 GB/s --pd-transfer-bandwidth default was exactly this: a rough guess for a RoCE-200G fabric (≈ half a 400 Gb/s line rate), now made explicit and per-cluster. pd_transfer_base_latency_ms is 0 here: the catalog states no inherent fabric base latency; the 0.05 ms --pd-transfer-base-latency default is a modeling placeholder held in blis-registry (R2 registry follow-up; refs in inference-sim#1632). The CLI flags remain as overrides, so a run naming no cluster is byte-identical."
